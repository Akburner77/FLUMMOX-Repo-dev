name: Build & Publish

on:
  push:
    branches: [ main, master, dev ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Determine output branch
        id: out
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "branch=builds-dev" >> $GITHUB_OUTPUT
          else
            echo "branch=builds" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.out.outputs.branch }}
          path: builds

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Clean old .cs3
        run: rm -f builds/*.cs3

      - name: Verify secret is visible
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "SECRET IS EMPTY OR MISSING — fix repo secret"
            exit 1
          fi
          echo "SECRET OK — length ${#TMDB_API_KEY}"

      - name: Fetch latest MovieBox version (soft-fail)
        id: mbver
        continue-on-error: true
        run: |
          set +e
          PKG="com.enjoy.moviebox" # Corrected package name
          VNAME=""
          VCODE=""
          echo "── Method 1: fetch MovieBox version from metadata APIs ──"

          # ── Source 1: APKPure API (Unofficial, may change) ──
          echo "→ APKPure..."
          R1=$(curl -sL --max-time 20 -H "User-Agent: Mozilla/5.0" \
            "https://api.pureapk.com/m/v3/cms/app_version?hl=en-US&package_name=$PKG")
          echo "→ APKPure resp: $(echo "$R1" | head -c 300)"
          if echo "$R1" | grep -q '"version"'; then
            VNAME=$(echo "$R1" | grep -oP '"version"\s*:\s*"\K[^"]+' | head -1)
            VCODE=$(echo "$R1" | grep -oP '"versionCode"\s*:\s*"?\K[0-9]+' | head -1)
          fi

          # ── Source 2: Aptoide API (Unofficial, may change) ──
          if [ -z "$VNAME" ]; then
            echo "→ Aptoide..."
            # The Aptoide API requires the numeric app ID, not the package name.
            # This URL first gets the app page to extract the ID, then queries the API.
            APTOIDE_APP_PAGE="https://en.aptoide.com/search?query=$PKG"
            APP_ID=$(curl -sL --max-time 20 -H "User-Agent: Mozilla/5.0" "$APTOIDE_APP_PAGE" | grep -oP '"app":{"id":\K[0-9]+' | head -1)
            if [ -n "$APP_ID" ]; then
              R2=$(curl -sL --max-time 20 "https://ws75.aptoide.com/api/7/getApp/app_id/$APP_ID")
              echo "→ Aptoide resp: $(echo "$R2" | head -c 300)"
              if echo "$R2" | grep -q '"versionName"'; then
                VNAME=$(echo "$R2" | grep -oP '"versionName"\s*:\s*"\K[^"]+' | head -1)
                VCODE=$(echo "$R2" | grep -oP '"versionCode"\s*:\s*"?\K[0-9]+' | head -1)
              fi
            fi
          fi

          # ── Source 3: APKMirror page scrape (fallback) ──
          if [ -z "$VNAME" ]; then
            echo "→ APKMirror..."
            R3=$(curl -sL --max-time 20 -H "User-Agent: Mozilla/5.0 (Linux; Android 13)" \
              "https://www.apkmirror.com/apk/moviebox/moviebox/")
            echo "→ APKMirror resp: $(echo "$R3" | head -c 300)"
            # This regex is more robust for the APKMirror page structure.
            VNAME=$(echo "$R3" | grep -oP 'Version:\s*[^<]*>\K[0-9][0-9.]*' | head -1)
          fi

          echo "→ FINAL: versionName='$VNAME' versionCode='$VCODE'"
          echo "version_name=$VNAME" >> $GITHUB_OUTPUT
          echo "version_code=$VCODE" >> $GITHUB_OUTPUT

      - name: Build plugins
        working-directory: src
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MB_VERSION_NAME_ENV: ${{ steps.mbver.outputs.version_name }}
          MB_VERSION_CODE_ENV: ${{ steps.mbver.outputs.version_code }}
        run: gradle make --no-daemon --no-configuration-cache --no-build-cache

      - name: Generate plugins.json
        working-directory: src
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: gradle makePluginsJson --no-daemon --no-configuration-cache --no-build-cache

      - name: Copy artifacts to builds
        run: |
          find src -name "*.cs3" -exec cp {} builds/ \;
          find src -name "plugins.json" -exec cp {} builds/ \;

      - name: Patch plugins.json URL and bump version
        env:
          NEW_VERSION: 192
          OUTPUT_BRANCH: ${{ steps.out.outputs.branch }}
        run: python3 src/scripts/patch_plugins.py

      - name: Push to builds branch
        working-directory: builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build $(date +%s)" || echo "no changes"
          git push origin HEAD:${{ steps.out.outputs.branch }} --force
