name: Build & Publish
on:
  push:
    branches: [ main, master, dev ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Determine output branch
        id: out
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "branch=builds-dev" >> $GITHUB_OUTPUT
          else
            echo "branch=builds" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.out.outputs.branch }}
          path: builds

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean old .cs3
        run: rm -f builds/*.cs3

      - name: Build plugins
        working-directory: src
        run: gradle make

      - name: Generate plugins.json
        working-directory: src
        run: gradle makePluginsJson

      - name: Copy artifacts to builds
        run: |
          find src -name "*.cs3" -exec cp {} builds/ \;
          find src -name "plugins.json" -exec cp {} builds/ \;

      - name: Patch plugins.json URL and bump version
        env:
          NEW_VERSION: 110
          OUTPUT_BRANCH: ${{ steps.out.outputs.branch }}
        run: python3 src/scripts/patch_plugins.py

      - name: Push to builds branch
        working-directory: builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build $(date +%s)" || echo "no changes"
          git push origin HEAD:${{ steps.out.outputs.branch }} --force
