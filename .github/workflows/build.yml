name: Build & Publish
on:
  push:
    branches: [ main, master, dev ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Determine output branch
        id: out
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "branch=builds-dev" >> $GITHUB_OUTPUT
          else
            echo "branch=builds" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.out.outputs.branch }}
          path: builds

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Clean old .cs3
        run: rm -f builds/*.cs3

      - name: Verify secret is visible
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "SECRET IS EMPTY OR MISSING — fix repo secret"
            exit 1
          fi
          echo "SECRET OK — length ${#TMDB_API_KEY}"

      - name: Fetch latest MovieBox version (soft-fail)
        id: mbver
        continue-on-error: true
        run: |
          set +e
          echo "── Method 1: fetch MovieBox APK version ──"

          echo "→ Downloading APK..."
          curl -sL --max-time 120 -o /tmp/mb.apk "https://d.apkpure.com/b/APK/com.community.mbox.in?version=latest" || true
          ls -la /tmp/mb.apk 2>/dev/null
          SIZE=$(stat -c%s /tmp/mb.apk 2>/dev/null || echo 0)
          echo "→ APK size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "→ APK download failed or too small — falling back to hardcoded"
            echo "version_name=" >> $GITHUB_OUTPUT
            echo "version_code=" >> $GITHUB_OUTPUT
            exit 0
          fi

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            AAPT=$(find /usr/local/lib/android/sdk/build-tools -name aapt 2>/dev/null | sort -V | tail -1)
          fi
          echo "→ aapt: $AAPT"
          if [ -z "$AAPT" ]; then
            echo "→ aapt not found — falling back"
            echo "version_name=" >> $GITHUB_OUTPUT
            echo "version_code=" >> $GITHUB_OUTPUT
            exit 0
          fi

          BADGING=$($AAPT dump badging /tmp/mb.apk 2>/dev/null | head -1)
          echo "→ badging: $BADGING"
          VNAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")
          VCODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+")
          echo "→ versionName=$VNAME versionCode=$VCODE"

          echo "version_name=$VNAME" >> $GITHUB_OUTPUT
          echo "version_code=$VCODE" >> $GITHUB_OUTPUT

      - name: Build plugins
        working-directory: src
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MB_VERSION_NAME_ENV: ${{ steps.mbver.outputs.version_name }}
          MB_VERSION_CODE_ENV: ${{ steps.mbver.outputs.version_code }}
        run: gradle make --no-daemon --no-configuration-cache --no-build-cache

      - name: Generate plugins.json
        working-directory: src
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: gradle makePluginsJson --no-daemon --no-configuration-cache --no-build-cache

      - name: Copy artifacts to builds
        run: |
          find src -name "*.cs3" -exec cp {} builds/ \;
          find src -name "plugins.json" -exec cp {} builds/ \;

      - name: Patch plugins.json URL and bump version
        env:
          NEW_VERSION: 189
          OUTPUT_BRANCH: ${{ steps.out.outputs.branch }}
        run: python3 src/scripts/patch_plugins.py

      - name: Push to builds branch
        working-directory: builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build $(date +%s)" || echo "no changes"
          git push origin HEAD:${{ steps.out.outputs.branch }} --force
